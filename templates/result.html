<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classification Result</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(
          135deg,
          #fef6e4,
          #f7d9e1
        ); /* Soft pastel background */
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        width: 100%;
        text-align: center;
      }
      h1 {
        color: #fa05c5;
        font-size: 24px;
        margin-bottom: 20px;
      }
      p {
        font-size: 18px;
        color: #333;
      }
      .prediction {
        font-size: 24px;
        font-weight: bold;
        color: #fa05c5;
      }
      .back-link {
        display: inline-block;
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #fa05c5;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
        transition: background-color 0.3s;
      }
      .back-link:hover {
        background-color: #fa05c5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Classification Result</h1>
      <p>The classification result is:</p>
      <p class="prediction">{{ prediction }}</p>
      <a href="/" class="back-link">Classify Another Case</a>
    </div>
  </body>
</html>
